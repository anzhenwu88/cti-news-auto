name: 每8小时提取中天新闻台URL

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 下载并提取中天新闻台URL
        run: |
          curl -s -o source.m3u https://raw.githubusercontent.com/692873350/iptv-sync/refs/heads/main/iptv_source.m3u
          grep -A1 'tvg-name="中天新闻台"' source.m3u | grep -E '^http' | head -1 > cti_url.txt
          if [ ! -s cti_url.txt ]; then
            echo "未找到中天新闻台URL，请检查源文件" > cti_url.txt
          fi

      - name: 提交并推送更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cti_url.txt
          git diff --staged --quiet || git commit -m "自动更新中天新闻台URL $(date +'%Y-%m-%d %H:%M:%S')"
          git push
